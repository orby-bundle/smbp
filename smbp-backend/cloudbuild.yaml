steps:

# Build Alert Scheduler Job
- name: 'gcr.io/cloud-builders/docker'
  args: ['build', '--target=alert-job', '-t', 'gcr.io/$PROJECT_ID/alert-scheduler', '.']

# Push the image
- name: 'gcr.io/cloud-builders/docker'
  args: ['push', 'gcr.io/$PROJECT_ID/alert-scheduler']

# Update the Cloud Run job
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['run', 'jobs', 'update', 'alert-scheduler', '--image', 'gcr.io/$PROJECT_ID/alert-scheduler:latest', '--region', 'europe-central2']